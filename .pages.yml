# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Edit at https://app.pagescms.org/johklo/johklo.github.io/master (sign in with GitHub).
media:
  input: static/images
  output: /images
  rename: safe
  categories: [image]

settings:
  commit:
    templates:
      create: "docs: create {path}"
      update: "docs: update {path}"
      delete: "docs: delete {path}"
      rename: "docs: rename {oldPath} -> {newPath}"

components:
  title:
    type: string
    label: 제목
    required: true
  description:
    type: string
    label: 한 줄 설명
  date:
    type: date
    label: 작성일
    options:
      time: true
      format: "yyyy-MM-dd'T'HH:mm:ss"
  lastmod:
    type: date
    label: 수정일
    default: ""
    options:
      time: true
      format: "yyyy-MM-dd'T'HH:mm:ss"
  tags:
    type: string
    label: 태그
    list: true
  weight:
    type: number
    label: 사이드바 순서 (작을수록 위)
  math:
    type: boolean
    label: 수식 사용
  draft:
    type: boolean
    label: 초안 (게시 안 함)
  aliases:
    type: string
    label: 예전 주소 (리다이렉트)
    list: true
  body:
    type: rich-text
    label: 본문
    options:
      format: markdown
      switcher: true
  rawbody:
    type: code
    label: 본문 (Markdown)
    options:
      language: markdown

content:
  - name: docs
    label: 문서
    type: group
    items:
      - name: tech
        label: Tech
        type: collection
        path: content/docs/tech
        exclude: [_index.md, "machine-learning-platform-engineering/**", "ai-agents-and-applications/**", "mlflow-azure-machine-learning/**", "ml-platform-engineering-labs/**"]
        filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
        view: &view
          fields: [title, date]
          primary: title
          sort: [date, title]
          default: { sort: date, order: desc }
        fields: &doc_fields
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: date, component: date }
          - { name: lastmod, component: lastmod }
          - { name: tags, component: tags }
          - { name: weight, component: weight }
          - { name: math, component: math }
          - { name: draft, component: draft }
          - { name: aliases, component: aliases }
          - { name: body, component: body }
      - name: ml-platform-engineering
        label: "Tech / Machine Learning Platform Engineering"
        type: collection
        path: content/docs/tech/machine-learning-platform-engineering
        exclude: [_index.md]
        filename: { template: "{primary}.md", field: create }
        view: &book_series_view
          fields: [title, weight]
          primary: title
          sort: [weight, title]
          default: { sort: weight, order: asc }
        fields: *doc_fields
      - name: ml-platform-engineering-labs
        label: "Tech / ML 플랫폼 엔지니어링 통합 실습"
        type: collection
        path: content/docs/tech/ml-platform-engineering-labs
        exclude: [_index.md]
        filename: { template: "{primary}.md", field: create }
        view: *book_series_view
        fields: *doc_fields
      - name: ai-agents-and-applications
        label: "Tech / AI Agents and Applications"
        type: collection
        path: content/docs/tech/ai-agents-and-applications
        exclude: [_index.md]
        filename: { template: "{primary}.md", field: create }
        view: *book_series_view
        fields: *doc_fields
      - name: mlflow-azure-machine-learning
        label: "Tech / MLflow와 Azure Machine Learning"
        type: collection
        path: content/docs/tech/mlflow-azure-machine-learning
        exclude: [_index.md]
        filename: { template: "{primary}.md", field: create }
        view: *book_series_view
        fields: *doc_fields
      - name: ai
        label: AI
        type: collection
        path: content/docs/ai
        exclude: [_index.md]
        filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
        view: *view
        fields: *doc_fields
      - name: business
        label: Business
        type: collection
        path: content/docs/business
        exclude: [_index.md]
        filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
        view: *view
        fields: *doc_fields
      - name: book
        label: Book
        type: collection
        path: content/docs/book
        exclude: [_index.md]
        filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
        view: *view
        fields: *doc_fields
      - name: insight
        label: Insight
        type: collection
        path: content/docs/insight
        exclude: [_index.md]
        filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
        view: *view
        fields: *doc_fields

  - name: pages
    label: 기본 · 카테고리 페이지
    type: group
    items:
      - name: home
        label: 홈
        type: file
        path: content/_index.md
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: toc, type: boolean, label: 목차 표시 }
          - { name: body, component: rawbody }
      - name: about
        label: About
        type: file
        path: content/about.md
        fields:
          - { name: title, component: title }
          - { name: body, component: body }
      - name: docs-index
        label: Docs 첫 페이지
        type: file
        path: content/docs/_index.md
        fields: &index_fields
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: weight, type: number, label: 카테고리 순서 }
          - name: sidebar
            type: object
            label: 사이드바
            fields:
              - { name: open, type: boolean, label: 펼쳐서 표시 }
          - { name: aliases, component: aliases }
          - { name: body, component: rawbody }
      - { name: tech-index, label: Tech 카테고리 페이지, type: file, path: content/docs/tech/_index.md, fields: *index_fields }
      - { name: ml-platform-engineering-index, label: Machine Learning Platform Engineering 카테고리 페이지, type: file, path: content/docs/tech/machine-learning-platform-engineering/_index.md, fields: *index_fields }
      - { name: ml-platform-engineering-labs-index, label: ML 플랫폼 엔지니어링 통합 실습 목차, type: file, path: content/docs/tech/ml-platform-engineering-labs/_index.md, fields: *index_fields }
      - { name: ai-agents-and-applications-index, label: AI Agents and Applications 카테고리 페이지, type: file, path: content/docs/tech/ai-agents-and-applications/_index.md, fields: *index_fields }
      - { name: mlflow-azure-machine-learning-index, label: MLflow와 Azure Machine Learning 목차, type: file, path: content/docs/tech/mlflow-azure-machine-learning/_index.md, fields: *index_fields }
      - { name: ai-index, label: AI 카테고리 페이지, type: file, path: content/docs/ai/_index.md, fields: *index_fields }
      - { name: business-index, label: Business 카테고리 페이지, type: file, path: content/docs/business/_index.md, fields: *index_fields }
      - name: book-index
        label: Book 카테고리 페이지
        type: file
        path: content/docs/book/_index.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: weight, type: number, label: 카테고리 순서 }
          - name: sidebar
            type: object
            label: 사이드바
            fields:
              - { name: open, type: boolean, label: 펼쳐서 표시 }
          - { name: aliases, component: aliases }
          - name: reading_list
            label: 독서 목록
            type: object
            list: true
            fields:
              - { name: id, type: string, label: 식별자, required: true }
              - { name: title, type: string, label: 책 제목, required: true }
              - { name: url, type: string, label: 독서 기록 주소 }
          - { name: body, component: rawbody }
      - { name: insight-index, label: Insight 카테고리 페이지, type: file, path: content/docs/insight/_index.md, fields: *index_fields }
