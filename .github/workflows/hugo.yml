name: Deploy Hugo site to GitHub Pages
run-name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  study-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned study dependencies
        run: >-
          python -m pip install --quiet
          mlflow==2.16.2 scikit-learn==1.5.2 feast==0.40.1
          pandas==2.2.3 numpy==1.26.4 pyarrow==17.0.0 kfp==2.10.1
      - name: Run the examples directly from the published chapters
        run: python -m unittest discover -s tests -p test_ml_platform_study.py -v

  build:
    needs: study-examples
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check public files
        run: |
          python3 -m unittest discover -s tests
          python3 tools/check_public_site.py
      - name: Fetch site assets
        uses: actions/checkout@v4
        with:
          repository: johklo/study-notes-private
          ref: master
          path: _site-assets
          sparse-checkout: notes
          ssh-key: ${{ secrets.SITE_ASSETS_KEY }}
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Prepare site assets
        run: python3 tools/prepare_site_assets.py _site-assets/notes public/notes
      - name: Package site
        run: tar --dereference --hard-dereference --directory public -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
